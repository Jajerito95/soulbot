services:
  - type: web
    name: soulbot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DB_PATH
        value: data/soulbot.db
      - key: PORT
        value: 8080
    disk:
      name: soulbot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
