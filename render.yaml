services:
  - type: web
    name: soulbot
    env: python
    plan: free
    buildCommand: apt-get update -y && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: RESET_PASSWORD
        sync: false
      - key: PORT
        value: 8080
